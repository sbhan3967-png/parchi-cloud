<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#C9A227">
<title>Parchi Cloud</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="debug-status" style="background:#fff3cd;color:#111;padding:12px;font:14px monospace;position:relative;z-index:99999">DEBUG: HTML loaded; waiting for JavaScript...</div>
<script>
(function () {
  var box = document.getElementById('debug-status');
  function log(m) { box.textContent += '\n' + m; }
  window.addEventListener('error', function (e) { log('ERROR: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')'); });
  window.addEventListener('unhandledrejection', function (e) { log('PROMISE ERROR: ' + String(e.reason)); });
  document.addEventListener('DOMContentLoaded', function () {
    log('DOM READY');
    log('Supabase: ' + typeof window.supabase);
    log('Login element: ' + !!document.getElementById('view-login'));
    var login = document.getElementById('view-login');
    if (login) {
      log('Login classes: ' + login.className);
      try { log('Login display: ' + getComputedStyle(login).display); } catch (err) { log('getComputedStyle failed'); }
    }
  });
})();
</script>
<header><h1>📒 Parchi Cloud</h1><button id="btn-logout" class="link" onclick="doLogout()" style="display:none">Logout</button></header>

<!-- LOGIN -->
<section id="view-login" class="view">
  <div class="login-box">
    <h2>Sign in</h2>
    <form onsubmit="doLogin(event)">
      <input id="login-email" type="email" placeholder="Email" autocomplete="username">
      <input id="login-pw" type="password" placeholder="Password" autocomplete="current-password">
      <button type="submit" class="primary">Sign In</button>
    </form>
    <button class="link" onclick="doSignup()">Create new account</button>
    <p id="login-msg" class="muted"></p>
  </div>
</section>

<!-- HOME -->
<section id="view-home" class="view">
  <div class="toolbar">
    <input id="home-search" placeholder="Search party..." oninput="loadParchis()">
    <button class="primary" onclick="openNew()">+ New Parchi</button>
  </div>
  <div id="home-list"></div>
</section>

<!-- NEW -->
<section id="view-new" class="view">
  <button class="link" onclick="enterApp()">← Back</button>
  <h2>New Parchi</h2>
  <label>Party name <input id="np-party" placeholder="e.g. JDM, Nitin Ji"></label>
  <label>Bill no <input id="np-billno" placeholder="e.g. 3231"></label>
  <label>Date <input id="np-date" type="date"></label>
  <div class="kindrow">
    <label><input type="radio" name="np-kind" value="silver" checked> Silver Parchi</label>
    <label><input type="radio" name="np-kind" value="gold"> Gold-Diamond</label>
  </div>
  <label>Metal rate Rs/kg <input id="np-rate" type="number" value="205000"></label>
  <label>Parchi photo</label>
  <div class="photorow">
    <label class="filebtn">📷 Camera<input type="file" id="np-cam" accept="image/*" capture="environment" onchange="onPhotoChosen(this)" hidden></label>
    <label class="filebtn">🖼️ Gallery<input type="file" id="np-gal" accept="image/*" onchange="onPhotoChosen(this)" hidden></label>
  </div>
  <p id="np-photo-name" class="muted">No photo chosen</p>
  <img id="np-preview" class="parchi-photo" style="display:none">
  <button id="np-save" class="primary big" onclick="saveNewParchi()">Save Parchi</button>
  <p id="np-msg" class="muted"></p>
</section>

<!-- DETAIL -->
<section id="view-detail" class="view">
  <div id="detail-head"></div>
  <div id="detail-body"></div>
</section>

<script src="js/config.js"></script>
<script src="js/math.js"></script>
<script src="js/app.js"></script>
<script>
// Unregister any old service worker and clear its caches (fixes stale cached app).
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function (regs) {
    regs.forEach(function (reg) { reg.unregister().catch(function(){}); });
  }).catch(function(){});
  if (window.caches && caches.keys) {
    caches.keys().then(function (keys) {
      keys.forEach(function (k) { caches.delete(k).catch(function(){}); });
    }).catch(function(){});
  }
}
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btn-logout').style.display = 'none';
});
const _enterApp = window.enterApp;
window.enterApp = async function() {
  document.getElementById('btn-logout').style.display = '';
  await _enterApp();
};
const _show = window.show;
</script>
</body>
</html>
